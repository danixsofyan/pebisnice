<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Pebisnice</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        color: #fafafa;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sedang offline</h1>
      <p>
        Tidak ada koneksi internet. Halaman kasir yang sudah pernah dibuka tetap bisa dipakai —
        transaksi akan tersimpan dan otomatis dikirim saat koneksi kembali.
      </p>
    </div>
  </body>
</html>
